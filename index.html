<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f4f2"><meta name="description" content="可跟随手指的液态玻璃放大镜。实时折射、色散与可调光学参数。"><title>Liquid Glass · 光学游乐场</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='8' width='48' height='48' rx='18' fill='%23c6e7ed' stroke='%231a525a' stroke-width='3'/%3E%3Cpath d='M16 26Q22 14 38 16' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script defer src="vendor/gsap.min.js"></script><script defer src="app.js"></script></head>
<body>
<header class="topbar"><a class="identity" href="./" aria-label="Liquid Glass 首页"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="3" width="22" height="22" rx="8" fill="#d4e8e7" stroke="#588487"/><path d="M7 13Q8 6 17 7" fill="none" stroke="white" stroke-width="2"/></svg><span>Liquid Glass <small>光学游乐场</small></span></a><div class="top-actions"><span class="engine" id="engine">正在准备画面</span><button id="toggle-panel" aria-controls="controls" aria-expanded="true">调节参数 <span aria-hidden="true">☷</span></button></div></header>
<main class="workspace"><section class="stage-wrap" aria-labelledby="scene-heading"><div class="scene-meta"><div><span class="eyebrow">TOUCH THE LIGHT</span><h1 id="scene-heading">让光，跟着你。</h1></div><p>滑动画面，探索玻璃里的另一种视角。</p></div><div class="stage" id="stage"><canvas id="glass" tabindex="0" role="img" aria-label="液态玻璃互动画面。在画面上拖动镜片，或使用方向键移动；加减键调整镜片大小。"></canvas><div id="fallback" hidden><h2>浏览器暂不支持实时折射</h2><p>仍可查看画面。请在支持 WebGL 的浏览器里打开。</p></div><div class="stage-top"><span id="scene-name">01 / 潮汐</span><button id="compare" aria-pressed="false">对比原图</button></div><div class="stage-bottom"><span class="touch-hint"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 12V5a2 2 0 014 0v6l2-1 4 2-2 8H9l-5-6a2 2 0 013-2l2 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>滑动探索液态玻璃</span></div></div><footer class="scene-footer"><div class="scenes" aria-label="选择背景"><button data-scene="tide" aria-pressed="true"><span class="swatch tide"></span>潮汐</button><button data-scene="type" aria-pressed="false"><span class="swatch type">Aa</span>字场</button><button data-scene="grid" aria-pressed="false"><span class="swatch grid"></span>标定</button><label class="upload" for="photo"><span aria-hidden="true">＋</span> 自选图片<input id="photo" type="file" accept="image/*"></label></div><button class="text-button" id="demo" aria-pressed="false">自动演示 <span aria-hidden="true">↗</span></button></footer></section>
<aside class="controls" id="controls" aria-labelledby="controls-title"><div class="panel-head"><div><span class="eyebrow">OPTICAL STUDIO</span><h2 id="controls-title">调一片你的玻璃。</h2></div><button id="reset" class="text-button">重置 ↺</button></div><div class="presets" aria-label="玻璃预设"><button data-preset="clear" aria-pressed="false">清透</button><button data-preset="liquid" aria-pressed="true">液态</button><button data-preset="bold" aria-pressed="false">强折射</button></div><div class="shape-row"><span>镜片形状</span><div class="segmented" aria-label="镜片形状"><button data-shape="4" aria-pressed="true">圆角方形</button><button data-shape="2" aria-pressed="false">圆形</button></div></div><div id="sliders" class="sliders"></div><label class="motion-option"><input id="reduce-motion" type="checkbox"> 减少动态效果</label><div class="panel-note"><span class="note-dot"></span><p>中心清晰放大，边缘弯曲折射。<br>试着把镜片移到文字或明暗交界。</p></div><button class="export" id="export">保存当前画面 <span aria-hidden="true">↓</span></button><p class="local-note">图片只在本机处理。</p></aside></main><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><p class="nojs">这是一个互动光学实验，需要启用 JavaScript。液态玻璃可跟随手指，并支持调整放大、折射与色散。</p></noscript>
</body></html>
